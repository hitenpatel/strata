name: Deploy Storybook to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cf-pages-storybook
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens
      - run: pnpm build-storybook
      - name: Pre-deploy asset gate
        run: |
          set -euo pipefail
          test -d storybook-static
          test -f storybook-static/index.html
          test -f storybook-static/_headers
          test -f storybook-static/_redirects
          test "$(find storybook-static -type f | wc -l)" -le 19999
          ! find storybook-static -type f -size +25M | grep -q .
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.122.0 pages deploy storybook-static \
            --project-name=ui-hiten-dev \
            --branch=main \
            --commit-hash=$GITHUB_SHA
